<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الألعاب التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
h1 { color: white; font-size: 32px; margin-bottom: 10px; text-align: center; }
p { color: rgba(255,255,255,0.8); margin-bottom: 40px; font-size: 16px; }
.games { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
.card {
  background: white;
  border-radius: 20px;
  padding: 30px 40px;
  text-align: center;
  text-decoration: none;
  color: #333;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: all 0.3s;
  max-width: 280px;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
.icon { font-size: 50px; margin-bottom: 15px; display: block; }
.footer { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<h1>🎮 الألعاب التعليمية</h1>
<p>اختاري اللعبة اللي تريدينها</p>
<div class="games">
  <a class="card" href="لعبة على التاء المربوطة والهاء.html">
    <span class="icon">✍️</span>
    لعبة على التاء المربوطة والهاء
  </a>
  <a class="card" href="اختبار على درس تحقيق الاحلام للصف الرابع الابتدائي.html">
    <span class="icon">🌟</span>
    اختبار درس تحقيق الأحلام — الصف الرابع
  </a>
</div>
<p class="footer">الألعاب التعليمية • مريم</p>
</body>
</html>
